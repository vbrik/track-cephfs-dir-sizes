[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trackdir"
dynamic = ["version"]
description = "Track CephFS directory sizes over time using recursive stats (rbytes, rctime)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
keywords = [
    "cephfs",
    "ceph",
    "directory size",
    "disk usage",
    "rbytes",
    "rctime",
    "storage monitoring",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Monitoring",
]

[project.scripts]
trackdir = "trackdir.cli:main"

[tool.setuptools.dynamic]
version = { attr = "trackdir.__version__" }

[tool.ruff]
target-version = "py312"
extend-exclude = ["*.md"]  # ruff would otherwise reformat code blocks in docs

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
